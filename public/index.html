<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炎上候補チェッカー</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#243042;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px}h1{margin:0 0 8px;font-size:1.9rem}p{line-height:1.6}.muted{color:#68758a;font-size:.88rem}.panel,.event{background:white;border:1px solid #e1e5ee;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 10px #20305008}.controls{display:flex;gap:8px;flex-wrap:wrap}input{min-width:260px;flex:1;border:1px solid #ccd3df;border-radius:9px;padding:12px;font:inherit}button{border:0;background:#2858c7;color:white;padding:12px 18px;border-radius:9px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e7ecf5;color:#243042}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.stats b{font-size:1.4rem}.event h3{margin:0 0 6px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#58647b;font-size:.86rem;margin:8px 0}.bar{height:9px;background:#e9edf3;border-radius:9px;overflow:hidden}.fill{height:100%;background:#e39b3d}.high{background:#dc6249}.low{background:#75a6a0}a{color:#2858c7}li{margin:7px 0}#status{min-height:24px}details{margin-top:10px}small{color:#6a7485}
</style></head><body><main>
<h1>🔥 炎上候補チェッカー</h1>
<p class="muted">Googleニュースの見出しをもとに「炎上らしい話題」を推定します。炎上の事実・責任・投稿内容の真偽を確定するものではありません。</p>
<section class="panel"><div class="controls"><input id="query" value="炎上 OR 物議 OR 批判殺到 OR 謝罪" aria-label="検索語"><button id="load">ニュースを取得して分析</button><button class="secondary" id="demo">サンプル表示</button><button class="secondary" id="csv">CSV出力</button></div><p class="muted">検索語は自由に変更できます。取得元: GoogleニュースRSS。ニュースの更新頻度とRSSの提供状況に依存します。</p><div id="status" role="status"></div></section>
<section class="panel"><div class="stats"><div>取得記事数<br><b id="articles">0</b></div><div>検出候補数<br><b id="groups">0</b></div><div>最終取得<br><b id="updated" style="font-size:1rem">—</b></div></div></section>
<div id="results"></div><p class="muted">注意: 見出しのキーワード一致を中心とする簡易判定です。類似事件の自動統合は限定的で、同じ記事の転載や検索語による偏りが生じます。実名を含む表示は必ず元記事で確認してください。</p>
</main><script>
const $=id=>document.getElementById(id);
let last=[];
const words=[/批判|批判殺到|非難|反発|物議|炎上|抗議|騒動|不適切|謝罪|釈明|疑惑|問題視|波紋|指摘|謝罪会見/];
function text(el,value){el.textContent=value}
function normalize(s){return s.normalize("NFKC").toLowerCase().replace(/[「」『』【】（）()\[\]、。!！?？:：・\s]/g,"")}
function tokenize(s){return [...new Set((s.normalize("NFKC").match(/[\p{Script=Han}]{2,}|[\p{Script=Katakana}]{3,}|[a-zA-Z0-9]{3,}/gu)||[]).map(normalize).filter(w=>w.length>=2&&!/^(ニュース|最新|速報|について|という|報道|話題|日本|記者|写真|動画|企業|会社|発表|炎上|批判|謝罪|物議|問題|疑惑|反発)$/.test(w)))].slice(0,12)}
function similar(a,b){const aa=tokenize(a.title),bb=tokenize(b.title);let common=aa.filter(x=>bb.some(y=>x===y||x.length>=4&&y.includes(x)||y.length>=4&&x.includes(y))).length;return common>=2||(common>=1&&normalize(a.title).slice(0,15)===normalize(b.title).slice(0,15))}
function parseRSS(xml){const doc=new DOMParser().parseFromString(xml,"application/xml");if(doc.querySelector("parsererror"))throw Error("RSSの解析に失敗しました");return [...doc.querySelectorAll("item")].map(item=>{let title=item.querySelector("title")?.textContent||"";let source=item.querySelector("source")?.textContent||"";if(source&&title.endsWith(" - "+source))title=title.slice(0,-source.length-3);return {title,source:source||"不明",url:item.querySelector("link")?.textContent||"",date:item.querySelector("pubDate")?.textContent||""}}).filter(x=>x.title)}
function analyze(items){const groups=[];for(const a of items){let g=groups.find(g=>g.items.some(b=>similar(a,b)));if(g)g.items.push(a);else groups.push({items:[a]})}return groups.map(g=>{const sources=new Set(g.items.map(x=>x.source)).size;const critical=g.items.filter(x=>words.some(r=>r.test(x.title))).length;const score=Math.min(100,Math.round(Math.min(g.items.length,10)*3+Math.min(sources,5)*5+Math.min(critical,10)*5));return {...g,score,sources,critical}}).sort((a,b)=>b.score-a.score)}
function render(items){last=analyze(items);text($("articles"),items.length);text($("groups"),last.length);text($("updated"),new Date().toLocaleString("ja-JP"));const root=$("results");root.replaceChildren();for(const g of last){const box=document.createElement("section");box.className="event";const h=document.createElement("h3");text(h,g.items[0].title);box.append(h);const meta=document.createElement("div");meta.className="meta";text(meta,"炎上候補指数 "+g.score+"/100 ・ "+g.items.length+"記事 ・ "+g.sources+"媒体 ・ 批判関連 "+g.critical+"件");box.append(meta);const bar=document.createElement("div");bar.className="bar";const fill=document.createElement("div");fill.className="fill "+(g.score>=70?"high":g.score<40?"low":"");fill.style.width=g.score+"%";bar.append(fill);box.append(bar);const details=document.createElement("details");const summary=document.createElement("summary");text(summary,"関連記事を見る");details.append(summary);const ul=document.createElement("ul");for(const a of g.items){const li=document.createElement("li");const link=document.createElement("a");link.href=a.url;link.target="_blank";link.rel="noopener noreferrer";text(link,a.title);li.append(link);const small=document.createElement("small");text(small," — "+a.source);li.append(small);ul.append(li)}details.append(ul);box.append(details);root.append(box)}if(!last.length)text(root,"該当記事はありませんでした。")}
$("load").onclick=async()=>{const btn=$("load");btn.disabled=true;text($("status"),"取得中…");try{const res=await fetch("/rss?q="+encodeURIComponent($("query").value));if(!res.ok)throw Error("RSS取得エラー: HTTP "+res.status);const xml=await res.text();const items=parseRSS(xml);render(items);text($("status"),items.length+"件のニュースを取得しました。")}catch(e){text($("status"),"取得できませんでした: "+e.message)}finally{btn.disabled=false}};
$("demo").onclick=()=>{render([{title:"架空企業Aの広告表現に批判が集中",source:"架空ニュース1",url:"#"}, {title:"架空企業Aの広告に物議、担当者が説明",source:"架空ニュース2",url:"#"}, {title:"架空企業Aが広告について謝罪",source:"架空ニュース3",url:"#"}, {title:"架空メーカーBの製品に不具合の疑い",source:"架空ニュース4",url:"#"}, {title:"架空メーカーBの製品について調査開始",source:"架空ニュース5",url:"#"}]);text($("status"),"架空のサンプルを表示しています。")};
$("csv").onclick=()=>{const rows=[["見出し","指数","記事数","媒体数","批判関連件数","URL"],...last.map(g=>[g.items[0].title,g.score,g.items.length,g.sources,g.critical,g.items[0].url])];const csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="enjo_candidates.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
